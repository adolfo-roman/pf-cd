{# templates/auth/login.html - CORREGIDO #}
<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DataNova — Acceso a Plataforma</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configuración de Tailwind -->
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  
  <!-- Custom styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
  
  <style>
    /* Asegurar que los gradientes funcionen correctamente */
    .gradient-text {
      background: linear-gradient(135deg, var(--electric-blue), var(--cyan), var(--purple));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    
    .gradient-bg {
      background: linear-gradient(135deg, var(--electric-blue), var(--cyan));
    }
    
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-fade-in {
      animation: fade-in 0.6s ease-out;
    }
    
    /* Variables de color para los botones */
    .bg-electric-blue\/10 { background-color: rgba(0, 102, 255, 0.1); }
    .bg-purple\/20 { background-color: rgba(139, 92, 246, 0.2); }
    .dark .bg-electric-blue\/10 { background-color: rgba(59, 130, 246, 0.1); }
    .dark .bg-purple\/20 { background-color: rgba(167, 139, 250, 0.2); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-background text-foreground">
  
  <!-- Background effects -->
  <div class="absolute inset-0 bg-gradient-to-br from-[#0066ff]/10 via-transparent to-[#8b5cf6]/10 dark:from-[#3b82f6]/10 dark:to-[#a78bfa]/10"></div>
  <div class="absolute top-20 left-20 w-96 h-96 bg-[#0066ff]/20 dark:bg-[#3b82f6]/20 rounded-full blur-3xl animate-pulse-slow"></div>
  <div class="absolute bottom-20 right-20 w-96 h-96 bg-[#8b5cf6]/20 dark:bg-[#a78bfa]/20 rounded-full blur-3xl animate-pulse-slow" style="animation-delay: 1s"></div>

  <!-- Theme Toggle Button -->
  <button onclick="toggleTheme()" class="fixed top-6 right-6 z-50 p-3 rounded-xl bg-card border border-border hover:border-electric-blue transition-all duration-300">
    <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
    </svg>
    <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/>
    </svg>
  </button>

  <!-- Logo Link -->
  <div class="fixed top-6 left-6 z-50">
    <a href="{{ url_for('main.landing') }}" class="flex items-center gap-3">
      <!-- Light mode logo (color) -->
      <img src="{{ url_for('static', filename='img/logo_colores.png') }}" alt="DataNova" class="w-24 h-24 object-contain dark:hidden">
      <!-- Dark mode logo (white) -->
      <img src="{{ url_for('static', filename='img/logo_blanco.png') }}" alt="DataNova" class="w-24 h-24 object-contain hidden dark:block">
    </a>
  </div>

  <!-- Login Card -->
  <div class="w-full max-w-md relative z-10 animate-fade-in">
    <div class="p-8 md:p-10 rounded-3xl bg-card/80 backdrop-blur-xl border border-border shadow-2xl">
      
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="w-16 h-16 mx-auto mb-4 rounded-2xl gradient-bg p-4">
          <svg class="w-full h-full text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <h1 class="text-3xl mb-2">
          <span class="gradient-text" id="form-title">Bienvenido de Nuevo</span>
        </h1>
        <p class="text-foreground/60" id="form-subtitle">
          Inicia sesión para acceder a la plataforma de detección de fraude
        </p>
      </div>

      <!-- Form -->
      <form method="POST" action="{{ url_for('main.login') }}" class="space-y-5">
        
        <!-- Name field (solo para registro) -->
        <div id="name-field" class="hidden">
          <label class="block text-sm mb-2 text-foreground/70">Nombre Completo</label>
          <div class="relative">
            <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-foreground/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <input type="text" name="name" id="name" class="w-full pl-12 pr-4 py-3.5 rounded-xl bg-input border border-border focus:border-electric-blue focus:outline-none transition-colors text-foreground" placeholder="Juan Pérez">
          </div>
        </div>

        <!-- Email field -->
        <div>
          <label class="block text-sm mb-2 text-foreground/70">Correo Electrónico</label>
          <div class="relative">
            <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-foreground/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="M22 7L12 13 2 7"/>
            </svg>
            <input type="email" name="email" id="email" class="w-full pl-12 pr-4 py-3.5 rounded-xl bg-input border border-border focus:border-electric-blue focus:outline-none transition-colors text-foreground" placeholder="tu@ejemplo.com" required>
          </div>
        </div>

        <!-- Password field -->
        <div>
          <label class="block text-sm mb-2 text-foreground/70">Contraseña</label>
          <div class="relative">
            <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-foreground/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input type="password" name="password" id="password" class="w-full pl-12 pr-12 py-3.5 rounded-xl bg-input border border-border focus:border-electric-blue focus:outline-none transition-colors text-foreground" placeholder="••••••••" required>
            <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-foreground/40 hover:text-foreground transition-colors">
              <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember me (solo login) -->
        <div id="remember-field" class="flex items-center gap-2 text-sm">
          <input type="checkbox" name="remember" id="remember" class="rounded border-border bg-input">
          <label for="remember" class="text-foreground/70">Recordarme</label>
        </div>

        <!-- Submit button -->
        <button type="submit" class="w-full py-4 rounded-xl gradient-bg text-white hover:shadow-2xl transition-all duration-300 flex items-center justify-center gap-2 group font-medium">
          <span id="submit-text">Iniciar Sesión</span>
          <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </form>

      <!-- Toggle between login and register -->
      <div class="mt-6 text-center">
        <button onclick="toggleForm()" class="text-foreground/70 hover:text-foreground transition-colors">
          <span id="toggle-text">¿No tienes cuenta? </span>
          <span class="gradient-text" id="toggle-action">Regístrate</span>
        </button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script>
    let isLogin = true;

    function toggleForm() {
      isLogin = !isLogin;
      
      const title = document.getElementById('form-title');
      const subtitle = document.getElementById('form-subtitle');
      const nameField = document.getElementById('name-field');
      const rememberField = document.getElementById('remember-field');
      const submitText = document.getElementById('submit-text');
      const toggleText = document.getElementById('toggle-text');
      const toggleAction = document.getElementById('toggle-action');
      
      if (isLogin) {
        title.textContent = 'Bienvenido de Nuevo';
        subtitle.textContent = 'Inicia sesión para acceder a la plataforma de detección de fraude';
        nameField.classList.add('hidden');
        rememberField.classList.remove('hidden');
        submitText.textContent = 'Iniciar Sesión';
        toggleText.textContent = '¿No tienes cuenta? ';
        toggleAction.textContent = 'Regístrate';
      } else {
        title.textContent = 'Crear Cuenta';
        subtitle.textContent = 'Únete a la Plataforma de Protección IA de DataNova';
        nameField.classList.remove('hidden');
        rememberField.classList.add('hidden');
        submitText.textContent = 'Crear Cuenta';
        toggleText.textContent = '¿Ya tienes cuenta? ';
        toggleAction.textContent = 'Inicia Sesión';
      }
    }

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    }
  </script>
</body>
</html>
